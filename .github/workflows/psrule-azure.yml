name: PSRule for Azure

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  storage-fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify secure transfer outcomes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Install-Module PSRule.Rules.Azure -Scope CurrentUser -Force
          Import-Module PSRule.Rules.Azure
          $rule = 'Azure.Storage.SecureTransfer'
          $template = az bicep build --file ./examples/psrule/storage.bicep --stdout
          if ($LASTEXITCODE -ne 0) {
            throw 'Bicep compilation failed.'
          }
          $resources = ($template | ConvertFrom-Json -AsHashtable).resources
          $results = @(foreach ($resource in $resources) {
            Invoke-PSRule -Module PSRule.Rules.Azure -Name $rule -InputObject $resource -Outcome All
          })
          $passed = @($results | Where-Object { $_.RuleName -eq $rule -and $_.Outcome -eq 'Pass' })
          $failed = @($results | Where-Object { $_.RuleName -eq $rule -and $_.Outcome -eq 'Fail' })
          if ($results.Count -ne 2 -or $passed.Count -ne 1 -or $failed.Count -ne 1) {
            $results | Format-Table RuleName, TargetName, Outcome
            throw 'Expected one passing fixture and one failing fixture for secure transfer.'
          }
          if ($passed[0].TargetName -notmatch 'cp365securefixture$' -or $failed[0].TargetName -notmatch 'cp365insecurefixture$') {
            throw 'PSRule returned an unexpected target for the secure transfer fixtures.'
          }
