name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pester:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Install Pester
        shell: pwsh
        run: Install-Module Pester -RequiredVersion 6.1.0 -Force -Scope CurrentUser
      - name: Run tests
        shell: pwsh
        run: |
          Import-Module Pester -RequiredVersion 6.1.0 -Force
          $result = Invoke-Pester -Path ./tests -PassThru
          if ($result.FailedCount -gt 0) {
            throw "$($result.FailedCount) test(s) failed."
          }
